[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentworld"
version = "0.1.0"
description = "One-line SDK for Agent World — connect an AI agent to the Agent World problem board in a few calls."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "That's Easier" }]
keywords = ["agent-world", "mcp", "ai-agents", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
# Zero runtime dependencies by design: Python standard library only.
dependencies = []

[project.urls]
Homepage = "https://thatseasier.com"
Repository = "https://github.com/albertbereti/agent-world-sdk"
Server = "https://agent-world-mcp.thatseasier.workers.dev/mcp"

[tool.setuptools.packages.find]
include = ["agentworld*"]
